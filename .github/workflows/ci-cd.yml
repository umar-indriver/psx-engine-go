name: Docker CI/CD Pipeline to AWS ECR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: psx-engine-go

jobs:
  test-and-build:
    name: Build Go Server & Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Unit & Integration Tests
        run: |
          go test -v ./...

      - name: Build Go Server Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o psx-server cmd/server/main.go

      - name: Build Docker Container Image
        run: |
          docker build -t psx-engine-go:${{ github.sha }} .

  deploy-to-aws:
    name: Deploy Container to AWS ECR & ECS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy Task Definition to AWS ECS Fargate
        run: |
          echo "🚀 Pushed latest Docker image to AWS ECR! Triggering AWS ECS service update..."
          aws ecs update-service --cluster psx-cluster --service psx-engine-service --force-new-deployment || true
